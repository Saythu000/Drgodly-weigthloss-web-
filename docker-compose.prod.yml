version: '3.8'

services:
  drgodly-web:
    environment:
      - NEXTAUTH_URL=https://${DOMAIN:?Set DOMAIN, e.g. DOMAIN=clinic.drgodly.com}

  caddy:
    image: caddy:2-alpine
    container_name: drgodly-caddy
    restart: always
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN:?Set DOMAIN, e.g. DOMAIN=clinic.drgodly.com}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - drgodly-web

volumes:
  caddy_data:
  caddy_config:
