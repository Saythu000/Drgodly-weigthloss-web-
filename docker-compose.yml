version: '3.8'

services:
  drgodly-web:
    image: ghcr.io/saythu000/drgodly-web:latest
    build:
      context: .
      dockerfile: Dockerfile
    container_name: drgodly-telehealth-app
    restart: always
    ports:
      - "3000:3000"
    env_file:
      - .env
    volumes:
      - openclaw_data:/app/.openclaw-local

volumes:
  openclaw_data:
